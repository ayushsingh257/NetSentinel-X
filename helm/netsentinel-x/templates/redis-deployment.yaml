apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "netsentinel-x.fullname" . }}-redis
  labels:
    app.kubernetes.io/name: {{ include "netsentinel-x.name" . }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "netsentinel-x.name" . }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "netsentinel-x.name" . }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image }}"
          ports:
            - containerPort: 6379
              name: redis
