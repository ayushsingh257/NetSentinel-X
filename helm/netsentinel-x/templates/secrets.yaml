# Production Secret Template for NetSentinel-X
# NOTE: In production environments, secrets should NEVER be committed to Git.
# Inject secrets securely via:
#   1. External Secrets Operator (ESO) binding to GCP Secret Manager / AWS Secrets Manager / Azure Key Vault
#   2. Pre-existing Kubernetes Secrets
#   3. CI/CD pipeline injection via Helm: --set secrets.jwtSecret="$SECURE_JWT_SECRET" --set secrets.dbPassword="$SECURE_DB_PASSWORD"
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netsentinel-x.fullname" . }}-secret
  labels:
    app.kubernetes.io/name: {{ include "netsentinel-x.name" . }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default "" | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | default "" | quote }}
