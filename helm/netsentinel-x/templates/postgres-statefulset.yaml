apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "netsentinel-x.fullname" . }}-postgres
  labels:
    app.kubernetes.io/name: {{ include "netsentinel-x.name" . }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "netsentinel-x.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "netsentinel-x.name" . }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "netsentinel-x.name" . }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgresql.image }}"
          env:
            - name: POSTGRES_DB
              value: "netsentinel_x_db"
            - name: POSTGRES_USER
              value: "netsentinel_admin"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "netsentinel-x.fullname" . }}-secret
                  key: DB_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}
