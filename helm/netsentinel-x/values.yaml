# Default values for NetSentinel-X V2 Helm Chart
global:
  environment: production
  domain: netsentinel.example.com

backend:
  replicaCount: 3
  image:
    repository: ghcr.io/ayushsingh257/netsentinel-x-backend
    tag: v2.0.0-Enterprise
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

nats:
  image: nats:2.10-alpine
  jetstream: true
  replicas: 3
  storage: 10Gi

redis:
  image: redis:7.2-alpine
  storage: 5Gi

clickhouse:
  image: clickhouse/clickhouse-server:24.3-alpine
  storage: 50Gi

postgresql:
  image: postgres:16-alpine
  storage: 20Gi

ingress:
  enabled: true
  className: gce
  hosts:
    - host: netsentinel.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: netsentinel-tls-cert
      hosts:
        - netsentinel.example.com
