# NetSentinel-X V2 — SonarQube & Code Quality Security Properties
sonar.projectKey=NetSentinel-X
sonar.projectName=NetSentinel-X Enterprise Production Security Platform
sonar.projectVersion=2.0.0

# Source Code Encoding & Directories
sonar.sourceEncoding=UTF-8
sonar.sources=backend,frontend
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/vendor/**

# Language Configurations
sonar.go.coverage.reportPaths=backend/coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Security & Quality Gate Standards
sonar.qualitygate.wait=true
sonar.security.hotspots.severity=HIGH
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1186
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.test.tsx
